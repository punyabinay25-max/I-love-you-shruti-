<!DOCTYPE html>
<html>
<head>
<title>For Shruti ❤️</title>
<style>
  body {
    background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fec5e5, #ffecd2);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
.container {
    text-align: center;
    color: white;
    z-index: 2;
  }
.photo {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 5px solid white;
    object-fit: cover;
    margin-bottom: 25px;
    box-shadow: 0 0 30px rgba(255,255,255,0.7);
    animation: floatPhoto 3s ease-in-out infinite;
  }
  @keyframes floatPhoto {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }
  h1 {
    font-size: 2.8rem;
    min-height: 60px;
  }
  #subtext {
    font-size: 1.3rem;
    margin: 20px 0;
    min-height: 30px;
  }
.heart,.sparkle {
    position: absolute;
    animation: float 6s infinite linear;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  button {
    padding: 15px 35px;
    font-size: 1.2rem;
    border: none;
    border-radius: 50px;
    background: white;
    color: #ff0066;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
  }
  button:hover { transform: scale(1.1); }
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <img src="shruti.jpg" class="photo" alt="Shruti">
  <h1 id="typewriter"></h1>
  <p id="subtext">You are my everything</p>
  <button onclick="newMessage()">Mere liye ek aur ❤️</button>
</div>

<script>
  // Typewriter effect
  const mainText = "I Love You Shruti ❤️";
  let j = 0;
  function typeWriter() {
    if (j < mainText.length) {
      document.getElementById("typewriter").innerHTML += mainText.charAt(j);
      j++;
      setTimeout(typeWriter, 100);
    }
  }
  typeWriter();

  // Messages
  const messages = [
    "Shruti, tumhari ek smile ke liye main duniya jeet lu",
    "Tum ho to har din Valentine's Day hai",
    "My heart beats only for you",
    "Tumse milna meri life ki best cheez hai",
    "Can we be us forever?",
    "Shruti, you are my home"
  ];
  let i = 0;
  function newMessage(){
    document.getElementById("subtext").innerText = messages[i];
    i = (i + 1) % messages.length;
  }

  // Auto play music after 1 click
  document.body.addEventListener('click', () => {
    document.getElementById('bgMusic').play();
  }, { once: true });

  // Floating hearts + sparkles
  setInterval(() => {
    let el = document.createElement("div");
    el.innerHTML = Math.random() > 0.5? "❤️" : "✨";
    el.className = Math.random() > 0.5? "heart" : "sparkle";
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }, 250);
</script>
</body>
</html>
